<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Seychelles — Key Statistics</title>
<style>
:root{
  --ink:#0b1b4c;--muted:#60708e;
  --social:#eaf4ff;--economic:#fff4df;--env:#e8f8f5;
  --blue:#0d6fe8;--blue2:#67b8f5;--gold:#d58b00;--green:#168f7e;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
.wrap{width:100%;max-width:none;margin:0;padding:16px 14px 28px;overflow-x:hidden}
.hero h1{font-size:42px;line-height:1.05;margin:6px 0 16px;color:#111f5a}
.pillar{border-radius:16px;padding:12px;margin:16px 0}
.social{background:var(--social)} .economic{background:var(--economic)} .environment{background:var(--env)}
.pillar-head{display:flex;align-items:center;gap:10px;padding:2px 4px 10px;flex-wrap:wrap}
.badge{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:23px;font-weight:700;flex:0 0 auto}
.social .badge{background:linear-gradient(135deg,#3978ec,#214ea8)}
.economic .badge{background:linear-gradient(135deg,#efb32f,#c47700)}
.environment .badge{background:linear-gradient(135deg,#5caf9f,#397f72)}
.pillar-head h2{font-size:26px;margin:0}
.social .pillar-head h2{color:#3055a5}.economic .pillar-head h2{color:#9c5d00}.environment .pillar-head h2{color:#397f72}
.tag{font-size:13px;color:#335987}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(205px,100%),1fr));gap:9px;width:100%;max-width:100%}
.card{background:#fff;border:1px solid rgba(14,76,145,.08);border-radius:11px;min-height:124px;padding:12px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 1px 0 rgba(10,36,95,.03);overflow:hidden}
.card > div:last-child{flex:1 1 auto}
.icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e8f3ff;font-size:21px;flex:0 0 auto}
.economic .icon{background:#fff0cf}.environment .icon{background:#dff3ee}
.label{font-size:12.5px;font-weight:700;line-height:1.22;margin-bottom:5px}
.value{font-size:24px;font-weight:800;line-height:1.05;color:#0c1b57;overflow-wrap:anywhere}
.period{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.25}
.meaning{font-size:11.5px;color:#284e7a;margin-top:6px;line-height:1.3;font-weight:600}
.card-source,.chart-source{font-size:10.5px;margin-top:7px;line-height:1.25}
.card-source a,.chart-source a{color:#3d6592;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere;word-break:break-word}.card-source,.chart-source,.period,.meaning,.label,.tag{overflow-wrap:anywhere;word-break:break-word}
.social-lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px;width:100%;max-width:100%}
.chart-card{background:#fff;border:1px solid rgba(14,76,145,.08);border-radius:11px;padding:14px;max-width:100%;overflow:hidden}
.chart-card h3{margin:0 0 4px;font-size:19px}
.chart-sub{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.35}
.donut-wrap{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:22px;align-items:center;min-height:220px;max-width:100%}
.donut{width:170px;height:170px;border-radius:50%;position:relative;margin:auto;box-shadow:inset 0 0 0 1px rgba(11,27,76,.06)}
.donut::after{content:"";position:absolute;inset:32px;background:#fff;border-radius:50%}
.donut-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;text-align:center;font-size:12px;font-weight:700;color:#233d70;pointer-events:none;padding:52px}
.legend{display:grid;gap:10px}
.legend-row{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;font-size:13px}
.swatch{width:12px;height:12px;border-radius:3px}.legend-label{color:#425a7c}.legend-value{font-weight:800;color:#0c1b57}
.internet-card{background:#fff;border:1px solid rgba(14,76,145,.08);border-radius:11px;padding:22px;display:flex;flex-direction:column;justify-content:center;max-width:100%;overflow:hidden}
.internet-top{display:flex;gap:14px;align-items:center}
.internet-icon{width:52px;height:52px;border-radius:50%;background:#e8f3ff;display:flex;align-items:center;justify-content:center;font-size:25px}
.internet-value{font-size:38px;font-weight:800;line-height:1;color:#0c1b57;margin:8px 0}
.internet-label{font-size:16px;font-weight:700}
.ocean-comparison{margin-top:10px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;width:100%;max-width:100%}
.compare-card{background:#fff;border:1px solid rgba(14,76,145,.08);border-radius:11px;padding:18px;text-align:center}
.compare-label{font-size:12px;font-weight:700;color:#3f6283;text-transform:uppercase;letter-spacing:.03em}
.compare-value{font-size:34px;line-height:1;font-weight:800;color:#0c1b57;margin:8px 0 5px}
.compare-note{font-size:12px;color:var(--muted)}
.sources{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding:16px 4px 0;font-size:13px;color:#4e6380;line-height:1.45}
.error{padding:20px;border:1px solid #e0a5a5;background:#fff6f6;border-radius:10px;color:#7b1e1e}

/* ---------- EMBED SAFETY — matched to finished Tuvalu dashboard ---------- */
html, body, #app, .wrap, .hero, .pillar, .pillar-head,
.cards, .card, .social-lower, .chart-card, .internet-card,
.sources, .ocean-comparison, .compare-card {
  max-width:100% !important;
  min-width:0 !important;
}

img,svg,canvas{
  max-width:100% !important;
}

.sources,.tag,.label,.period,.meaning,.card-source,.chart-source,
.internet-label,.legend-label,.legend-value,.compare-note,.compare-label{
  overflow-wrap:anywhere;
  word-break:break-word;
}

body{
  overflow-x:hidden !important;
}

@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.social-lower{grid-template-columns:1fr}}
@media(max-width:760px){.social-lower{grid-template-columns:1fr}.donut-wrap{grid-template-columns:1fr}.ocean-comparison{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px 10px}.hero h1{font-size:34px}.cards{grid-template-columns:1fr}.value{font-size:27px}.pillar-head h2{font-size:23px}}
</style>
</head>
<body>
<div id="app" class="wrap">Loading…</div>
<script>
const DATA_URL=new URLSearchParams(location.search).get("data")||"data.json";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function cards(items){
  return `<div class="cards">${items.map(x=>`
  <div class="card"><div class="icon">${esc(x.icon)}</div><div>
  <div class="label">${esc(x.label)}</div><div class="value">${esc(x.value)}</div>
  <div class="period">${esc(x.period)}</div>
  ${x.meaning?`<div class="meaning">${esc(x.meaning)}</div>`:""}
  ${x.source?`<div class="card-source">Source: <a href="${esc(x.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(x.source)}</a></div>`:""}
  </div></div>`).join("")}</div>`;
}
function donutChart(c){
  const total=c.series.reduce((s,d)=>s+Number(d.value||0),0)||1;
  const colors=["#0d6fe8","#67b8f5","#b7d7fb"];
  let cursor=0;
  const stops=c.series.map((d,i)=>{const start=cursor,pct=Number(d.value||0)/total*100;cursor+=pct;return `${colors[i%colors.length]} ${start}% ${cursor}%`;}).join(",");
  const legend=c.series.map((d,i)=>`<div class="legend-row"><span class="swatch" style="background:${colors[i%colors.length]}"></span><span class="legend-label">${esc(d.label)}</span><span class="legend-value">${esc(d.display)}</span></div>`).join("");
  return `<div class="chart-card"><h3>${esc(c.title)}</h3><div class="chart-sub">${esc(c.subtitle)}</div><div class="donut-wrap">
  <div style="position:relative;width:170px;height:170px;margin:auto"><div class="donut" style="background:conic-gradient(${stops})"></div><div class="donut-center">Population</div></div>
  <div class="legend">${legend}</div></div><div class="chart-source">Source: <a href="${esc(c.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(c.source)}</a></div></div>`;
}
function internetCard(x){
  return `<div class="internet-card"><div class="internet-top"><div class="internet-icon">${esc(x.icon || "📶")}</div><div><div class="internet-label">${esc(x.label)}</div><div class="internet-value">${esc(x.value)}</div><div class="period">${esc(x.period)}</div></div></div>
  ${x.meaning?`<div class="meaning">${esc(x.meaning)}</div>`:""}<div class="card-source">Source: <a href="${esc(x.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(x.source)}</a></div></div>`;
}
function pillar(cls,title,tag,content){
  const badgeIcon=cls==="social"?"👥":cls==="economic"?"↗":"❧";
  return `<section class="pillar ${cls}"><div class="pillar-head"><div class="badge">${badgeIcon}</div><h2>${esc(title)}</h2><div class="tag">${esc(tag)}</div></div>${content}</section>`;
}
function envComparison(d){
  const land=d.environment.cards.find(x=>x.label==="Land area");
  const eez=d.environment.cards.find(x=>x.label==="Exclusive Economic Zone");
  return `<div class="ocean-comparison">
    <div class="compare-card"><div class="compare-label">Land area</div><div class="compare-value">${esc(land.value)}</div><div class="compare-note">${esc(land.period)}</div><div class="card-source">Source: <a href="${esc(land.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(land.source)}</a></div></div>
    <div class="compare-card"><div class="compare-label">Exclusive Economic Zone</div><div class="compare-value">${esc(eez.value)}</div><div class="compare-note">${esc(eez.period)}</div><div class="card-source">Source: <a href="${esc(eez.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(eez.source)}</a></div></div>
  </div>`;
}
async function load(){
 try{
  const res=await fetch(DATA_URL,{cache:"no-store"});if(!res.ok)throw new Error(`HTTP ${res.status}`);
  const d=await res.json();
  const envTop=d.environment.cards.filter(x=>!["Land area","Exclusive Economic Zone"].includes(x.label));
  document.getElementById("app").innerHTML=`
    <div class="hero"><h1>${esc(d.meta.title)}</h1></div>
    ${pillar("social","SOCIAL",d.social.tag,
      cards(d.social.cards)+`<div class="social-lower">${donutChart(d.social.populationConcentrationChart)}${internetCard(d.social.internetAccess)}</div>`)}
    ${pillar("economic","ECONOMIC",d.economic.tag,cards(d.economic.cards))}
    ${pillar("environment","ENVIRONMENTAL",d.environment.tag,
      envComparison(d)+`<div style="margin-top:10px">${cards(envTop)}</div>`)}
    <div class="sources"><div><strong>Official sources:</strong> ${d.sources.map(esc).join("; ")}</div><div><strong>Data file updated:</strong> ${esc(d.meta.lastUpdated)}</div></div>`;
 }catch(err){
  document.getElementById("app").innerHTML=`<div class="error"><strong>Could not load data.</strong><br>${esc(err.message)}</div>`;
 }
}
load();
</script>
</body>
</html>
