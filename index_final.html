<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Seychelles — Key Statistics</title>
<style>
:root{
  --ink:#0b1b4c;--muted:#60708e;--line:#dce7f2;--card:#fff;
  --social:#eaf4ff;--economic:#fff4df;--env:#e8f8f5;
  --blue:#0d6fe8;--blue2:#67b8f5;--gold:#e29a20;--gold2:#f5c65f;--green:#18a48f;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
.wrap{width:100%;padding:16px 14px 28px;overflow-x:hidden}
.hero{margin-bottom:16px}
.hero h1{font-size:42px;line-height:1.05;margin:6px 0 6px;color:#111f5a}
.hero p{font-size:15px;line-height:1.4;margin:0;color:#334a77}
.pillar{border-radius:16px;padding:12px;margin:16px 0}
.social{background:var(--social)} .economic{background:var(--economic)} .environment{background:var(--env)}
.pillar-head{display:flex;align-items:center;gap:10px;padding:2px 4px 10px;flex-wrap:wrap}
.badge{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:bold;flex:0 0 auto}
.social .badge{background:linear-gradient(135deg,#0878ef,#0a4da4)}
.economic .badge{background:linear-gradient(135deg,#f0ad34,#c97900)}
.environment .badge{background:linear-gradient(135deg,#16a995,#087565)}
.pillar-head h2{font-size:26px;margin:0}
.social .pillar-head h2{color:#114ea8}
.economic .pillar-head h2{color:#a96000}
.environment .pillar-head h2{color:#087565}
.tag{font-size:13px;color:#335987}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:9px;width:100%}
.card{background:#fff;border:1px solid rgba(14,76,145,.08);border-radius:11px;min-height:124px;padding:12px;overflow:hidden;display:flex;gap:12px;align-items:flex-start;box-shadow:0 1px 0 rgba(10,36,95,.03)}
.icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e8f3ff;font-size:21px;flex:0 0 auto}
.social .icon{background:#e8f3ff}
.economic .icon{background:#fff0cf}
.environment .icon{background:#dff3ee}
.label{font-size:12.5px;font-weight:700;line-height:1.22;margin-bottom:5px}
.value{font-size:24px;font-weight:800;line-height:1.05;color:#0c1b57}
.period{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.25}
.meaning{font-size:11.5px;color:#284e7a;margin-top:6px;line-height:1.3;font-weight:600}
.card-source,.chart-source{font-size:10.5px;margin-top:7px;line-height:1.25}
.card-source a,.chart-source a{color:#3d6592;text-decoration:underline;text-underline-offset:2px}
.visual-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.chart-card,.story-card,.compare-card{background:#fff;border:1px solid rgba(14,76,145,.08);border-radius:11px;padding:14px}
.chart-card h3,.story-card h3{margin:0 0 4px;font-size:19px}
.chart-sub{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.35}
.bar-chart{display:grid;gap:12px;margin-top:10px}
.bar-row{display:grid;grid-template-columns:62px 1fr 82px;gap:10px;align-items:center;font-size:12px}
.bar-label{font-weight:700;color:#35557b}
.bar-track{height:18px;background:#eef3f8;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#0d6fe8,#67b8f5);border-radius:999px}
.bar-value{text-align:right;font-weight:800;color:#0c1b57}
.note{background:rgba(255,255,255,.74);border-radius:11px;padding:14px 16px;font-size:14px;line-height:1.45;color:#365270;margin-top:10px}
.ocean-comparison{margin-top:10px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.compare-card{text-align:center}
.compare-label{font-size:12px;font-weight:700;color:#3f6283;text-transform:uppercase;letter-spacing:.03em}
.compare-value{font-size:34px;line-height:1;font-weight:800;color:#0c1b57;margin:8px 0 5px}
.compare-note{font-size:12px;color:var(--muted)}
.sources{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding:16px 4px 0;font-size:13px;color:#4e6380;line-height:1.45}
.error{padding:20px;border:1px solid #e0a5a5;background:#fff6f6;border-radius:10px;color:#7b1e1e}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.visual-grid{grid-template-columns:1fr}}
@media(max-width:760px){.ocean-comparison{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px 10px}.hero h1{font-size:34px}.cards{grid-template-columns:1fr}.value{font-size:27px}.pillar-head h2{font-size:23px}.bar-row{grid-template-columns:52px 1fr 72px}}
</style>
</head>
<body>
<div id="app" class="wrap">Loading…</div>
<script>
const DATA_URL = new URLSearchParams(location.search).get("data") || "data.json";
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function cards(items){
  return `<div class="cards">${items.map(x=>`
  <div class="card"><div class="icon">${esc(x.icon)}</div><div>
  <div class="label">${esc(x.label)}</div><div class="value">${esc(x.value)}</div>
  <div class="period">${esc(x.period)}</div>
  ${x.meaning?`<div class="meaning">${esc(x.meaning)}</div>`:""}
  ${x.source?`<div class="card-source">Source: ${x.sourceUrl?`<a href="${esc(x.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(x.source)}</a>`:esc(x.source)}</div>`:""}
  </div></div>`).join("")}</div>`;
}

function barChart(c, fixedMax=null){
  const max = fixedMax || Math.max(...c.series.map(d=>Number(d.value)),1);
  return `<div class="chart-card"><h3>${esc(c.title)}</h3><div class="chart-sub">${esc(c.subtitle)}</div>
  <div class="bar-chart">${c.series.map(d=>`
  <div class="bar-row"><div class="bar-label">${esc(d.label)}</div>
  <div class="bar-track"><div class="bar-fill" style="width:${(Number(d.value)/max*100).toFixed(1)}%"></div></div>
  <div class="bar-value">${esc(d.display ?? d.value)}</div></div>`).join("")}</div>
  <div class="chart-source">Source: <a href="${esc(c.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(c.source)}</a></div></div>`;
}

function pillar(cls,title,tag,strap,content){
  const badgeIcon = cls==="social" ? "👥" : cls==="economic" ? "↗" : "❧";
  return `<section class="pillar ${cls}"><div class="pillar-head"><div class="badge">${badgeIcon}</div>
  <h2>${esc(title)}</h2><div class="tag">${esc(tag)}</div></div>${content}</section>`;
}

function envComparison(d){
  const land=d.environment.cards.find(x=>x.label==="Land area");
  const eez=d.environment.cards.find(x=>x.label==="Exclusive Economic Zone");
  if(!land||!eez) return "";
  return `<div class="ocean-comparison">
  <div class="compare-card"><div class="compare-label">Land area</div><div class="compare-value">${esc(land.value)}</div><div class="compare-note">${esc(land.period)}</div><div class="card-source">Source: <a href="${esc(land.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(land.source)}</a></div></div>
  <div class="compare-card"><div class="compare-label">Exclusive Economic Zone</div><div class="compare-value">${esc(eez.value)}</div><div class="compare-note">${esc(eez.period)}</div><div class="card-source">Source: <a href="${esc(eez.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(eez.source)}</a></div></div>
  </div>`;
}

async function load(){
  try{
    const res=await fetch(DATA_URL,{cache:"no-store"});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const d=await res.json();

    const envTop=d.environment.cards.filter(x=>!["Land area","Exclusive Economic Zone"].includes(x.label));

    document.getElementById("app").innerHTML=`
      <div class="hero"><h1>${esc(d.meta.title)}</h1><p>${esc(d.meta.subtitle)}</p></div>

      ${pillar("social","SOCIAL",d.social.tag,d.social.strap,
        cards(d.social.cards)+`<div class="visual-grid"><div>${barChart(d.social.ageChart,100)}</div></div>`)}

      ${pillar("economic","ECONOMIC",d.economic.tag,d.economic.strap,
        cards(d.economic.cards)+`<div class="visual-grid"><div>${barChart(d.economic.tourismChart)}</div></div>`)}

      ${pillar("environment","ENVIRONMENTAL",d.environment.tag,d.environment.strap,
        envComparison(d)+`<div style="margin-top:10px">${cards(envTop)}</div>`)}

      <div class="sources"><div><strong>Official sources:</strong> ${d.sources.map(esc).join("; ")}</div>
      <div><strong>Data file updated:</strong> ${esc(d.meta.lastUpdated)}</div></div>`;
  }catch(err){
    document.getElementById("app").innerHTML=`<div class="error"><strong>Could not load data.</strong><br>${esc(err.message)}<br><br>Make sure this file and <strong>data.json</strong> are hosted in the same folder.</div>`;
  }
}
load();
</script>
</body>
</html>
